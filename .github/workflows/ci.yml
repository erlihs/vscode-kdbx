name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm compatibility
      - run: pnpm audit --prod
  vscode-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [1.101.0, stable]
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter kdbx smoke
        env:
          KDBX_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/kdbx-smoke-diagnostics
      - if: runner.os != 'Linux'
        run: pnpm --filter kdbx smoke
        env:
          KDBX_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/kdbx-smoke-diagnostics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs-${{ matrix.os }}-${{ matrix.vscode }}
          path: ${{ runner.temp }}/kdbx-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.vscode == 'stable'
        with:
          name: kdbx-smoke-vsix
          path: packages/extension/dist/kdbx.vsix
          retention-days: 7
  keepassxc-interop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends keepassxc
      - run: pnpm install --frozen-lockfile
      - run: pnpm interop -- --app keepassxc
  keepass-interop:
    runs-on: windows-latest
    env:
      KEEPASS_URL: https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.61.1/KeePass-2.61.1.zip/download
      KEEPASS_SHA256: 3952354db9b117e906f7cd4f9f5591065b95186472370da47f46f3e246fea864
      KPSCRIPT_URL: https://keepass.info/extensions/v2/kpscript/KPScript-2.61.1.zip
      KPSCRIPT_SHA256: 06c9d95332fe7b2730e4e7fd0aba846c5fa9a1b0cd3119defea9875727a3bffb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install KeePass 2.x with KPScript (pinned hashes)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP keepass
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($name in 'KEEPASS', 'KPSCRIPT') {
            $zip = Join-Path $dir "$name.zip"
            curl.exe -fsSL -o $zip ([Environment]::GetEnvironmentVariable("${name}_URL"))
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne [Environment]::GetEnvironmentVariable("${name}_SHA256")) { throw "$name hash mismatch" }
            Expand-Archive -Force $zip (Join-Path $dir app)
          }
          "KPSCRIPT=$(Join-Path $dir app\KPScript.exe)" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm interop -- --app keepass
